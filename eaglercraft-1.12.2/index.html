<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="Play minecraft 1.12 in your browser" />
    <meta name="keywords" content="eaglercraft, minecraft, 1.12, 1.12.2" />

    <title>Eaglercraft 1.12.2</title>

    <meta property="og:locale" content="en-US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eaglercraft 1.12 WASM" />
    <meta property="og:description" content="Play minecraft 1.12 in your browser" />
    <meta property="og:image"
        content="https://cdn.jsdelivr.net/gh/sebwebstuff/eaglercraft-1.12.2@main/favicon.png" />

    <link
        type="image/png"
        rel="shortcut icon"
        href="https://cdn.jsdelivr.net/gh/sebwebstuff/eaglercraft-1.12.2@main/favicon.png"
    />

    <script
        type="text/javascript"
        src="https://cdn.jsdelivr.net/gh/sebwebstuff/eaglercraft-1.12.2@main/bootstrap.js">
    <\/script>

    <script type="text/javascript">
        "use strict";

        window.addEventListener("load", function() {

            if (window.location.href.indexOf("file:") === 0) {

                alert(
                    "HTTP please, do not open this file locally, " +
                    "run a local HTTP server and load it via HTTP"
                );

            } else {

                // Launch options

                var relayId = Math.floor(Math.random() * 3);

                window.eaglercraftXOpts = {
                    demoMode: false,

                    container: "game_frame",

                    assetsURI:
                        "https://cdn.jsdelivr.net/gh/sebwebstuff/eaglercraft-1.12.2@main/assets.epw",

                    worldsDB: "worlds",

                    servers: [],

                    relays: [
                        {
                            addr: "wss://relay.deev.is/",
                            comment: "lax1dude relay #1",
                            primary: relayId == 0
                        },
                        {
                            addr: "wss://relay.lax1dude.net/",
                            comment: "lax1dude relay #2",
                            primary: relayId == 1
                        },
                        {
                            addr: "wss://relay.shhnowisnottheti.me/",
                            comment: "ayunami relay #1",
                            primary: relayId == 2
                        }
                    ]
                };

                // URL server parameter

                var q = window.location.search;

                if (
                    typeof q === "string" &&
                    q[0] === "?" &&
                    typeof window.URLSearchParams !== "undefined"
                ) {

                    q = new window.URLSearchParams(q);

                    var s = q.get("server");

                    if (s) {
                        window.eaglercraftXOpts.joinServer = s;
                    }
                }

                // Start Eaglercraft

                main();
            }
        });
    <\/script>
</head>

<body
    style="
        margin:0px;
        width:100%;
        height:100%;
        overflow:hidden;
        background-color:black;
    "
    id="game_frame">
</body>
</html>
